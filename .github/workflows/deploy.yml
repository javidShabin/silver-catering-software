name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
           
            cd ~/apps/silver-catering-software
            
            git pull origin main
            
            cd apps/backend
            
            npm install
            
            cd ../frontend
            
            npm install
            
            npm run build
            
            # Copy built files to Nginx folder
            cp -r dist/* /var/www/silvercatering/
            
            pm2 restart all

