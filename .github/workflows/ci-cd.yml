name: Perfect CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./apps/frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload Frontend to VPS Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "~/frontend-temp-dist"

      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Move new build to Nginx directory
            cp -r ~/frontend-temp-dist/dist/* /var/www/silvercatering/
            rm -rf ~/frontend-temp-dist
            
            # Deploy backend
            cd ~/apps/silver-catering-software
            git pull origin main
            cd apps/backend
            npm install
            npx prisma generate
            pm2 restart all
